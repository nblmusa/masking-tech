[phases.setup]
nixPkgs = ["python3", "gcc", "glibc", "nodejs"]

[phases.install]
cmds = [
    "python3 -m pip install rembg",
    "npm install --legacy-peer-deps", 
    "npm install --platform=linux --arch=x64 sharp",
    "npm install --platform=linux --arch=x64 @tensorflow/tfjs-node"
]

[build]
cmds = ["npm run build"]

[start]
cmds = ["npm run start"]