  <path d="M200 35 L210 45 L200 55 L190 45 Z" fill="white"/>
  
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569" font-weight="bold">Office Background</text>
