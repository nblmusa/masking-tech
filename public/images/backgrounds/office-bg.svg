  <rect x="310" y="170" width="40" height="40" fill="#94a3b8" opacity="0.6"/>
  
  <!-- Windows on second floor -->
  <rect x="70" y="130" width="40" height="40" fill="#94a3b8" opacity="0.6"/>
  <rect x="130" y="130" width="40" height="40" fill="#94a3b8" opacity="0.6"/>
