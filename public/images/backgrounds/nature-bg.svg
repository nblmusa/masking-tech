<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="natureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="150" fill="url(#skyGrad)"/>
  
  <!-- Grass -->
  <rect x="0" y="150" width="400" height="150" fill="url(#natureGrad)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="50" r="25" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Trees -->
  <circle cx="80" cy="120" r="35" fill="#16a34a" opacity="0.8"/>
  <circle cx="120" cy="130" r="30" fill="#16a34a" opacity="0.8"/>
  <circle cx="160" cy="125" r="32" fill="#16a34a" opacity="0.8"/>
  <circle cx="200" cy="135" r="28" fill="#16a34a" opacity="0.8"/>
  <circle cx="240" cy="125" r="33" fill="#16a34a" opacity="0.8"/>
  <circle cx="280" cy="130" r="30" fill="#16a34a" opacity="0.8"/>
  <circle cx="320" cy="125" r="35" fill="#16a34a" opacity="0.8"/>
  
  <!-- Tree trunks -->
  <rect x="75" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  <rect x="115" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  <rect x="155" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  <rect x="195" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  <rect x="235" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  <rect x="275" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  <rect x="315" y="150" width="10" height="20" fill="#92400e" opacity="0.7"/>
  
  <!-- Nature icon -->
  <circle cx="200" cy="220" r="25" fill="#22c55e" opacity="0.8"/>
  <path d="M200 205 L210 215 L200 225 L190 215 Z" fill="white"/>
  
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#16a34a" font-weight="bold">Nature Background</text>
</svg>
